<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 用户登录</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f0f8ff; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 400px;
        }
        
        .system-name {
            text-align: center;
            color: #2980b9;
            margin-bottom: 30px;
        }
        
        table {
            width: 100%;
        }
        
        table td {
            padding: 8px;
        }
        
        .label-column {
            width: 80px;
            text-align: right;
            font-weight: bold;
            color: #333;
        }
        
        input[type="text"], 
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            font-size: 14px;
        }
        
        .button-row {
            text-align: center;
            padding-top: 20px;
        }
        
        .login-btn, 
        .register-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 10px;
        }
        
        .login-btn {
            background-color: #2980b9;
            color: white;
        }
        
        .register-btn {
            background-color: #ecf0f1;
            color: #333;
        }
        
        .login-btn:hover {
            background-color: #3498db;
        }
        
        .register-btn:hover {
            background-color: #bdc3c7;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="system-name">图书管理系统</h1>
        
        <form action="#" method="post">
            <table>
                <tr>
                    <td class="label-column">用户名：</td>
                    <td><input type="text" name="username" placeholder="请输入用户名/借书证号" required></td>
                </tr>
                <tr>
                    <td class="label-column">密码：</td>
                    <td><input type="password" name="password" placeholder="请输入密码" required></td>
                </tr>
                <tr>
                    <td class="label-column">用户角色：</td>
                    <td>
                        <select name="role">
                            <option value="user" selected>普通用户</option>
                            <option value="admin">管理员</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="button-row">
                        <button type="submit" class="login-btn">登录</button>
                        <button type="button" class="register-btn" onclick="window.location.href='register.html'">注册</button>
                    </td>
                </tr>
            </table>
        </form>
        
        <div class="footer">
            <p><small>版权所有 © 2025 学号：2024061010000517 姓名：刘翔</small></p>
        </div>
    </div>
</body>
</html>
